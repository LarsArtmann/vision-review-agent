name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # go-cqrs-lite imports encoding/json/v2, which only exists under
      # GOEXPERIMENT=jsonv2 (local dev sets it via `go env`). Every job that
      # loads packages (build/vet/test/tidy) needs it.
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Guards the repo against the recurring json/v2 breakage class
      # (documented 4 incidents in AGENTS.md): the go-auto-upgrade daemon
      # edits imports directly, bypassing lint. depguard only covers lint
      # runs, so this grep is the only gate that fires on a plain commit.
      # Mirror of the depguard deny list in .golangci.yaml.
      - name: Forbid encoding/json/v2 and jsontext imports
        run: |
          if git grep -nE --untracked '"encoding/json/(v2|jsontext)(/[a-z0-9]+)?"' -- '*.go'; then
            echo "::error::Direct encoding/json/v2 or encoding/json/jsontext imports are forbidden."
            echo "::error::The jsonv2 experiment swaps encoding/json in place; the v2 import paths need a go.mod replace and a different low-level API (see AGENTS.md)."
            echo "::error::Import plain encoding/json instead - it transparently supports both regimes."
            exit 1
          fi
          echo "No forbidden json/v2 imports found."

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Verify examples compile
        run: go build ./examples/...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Coverage gate (>=70%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 70% threshold"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify golangci-lint config
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint config verify

      - name: golangci-lint
        # v7 is required for golangci-lint v2 (v6 resolved "latest" to a
        # stale v1.64.8 binary built with go1.24, unable to target go 1.26).
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12.2
          args: --timeout 5m

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)"

  jsonv2-compat:
    name: encoding/json v2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build & test under GOEXPERIMENT=jsonv2
        run: |
          GOEXPERIMENT=jsonv2 go build ./...
          GOEXPERIMENT=jsonv2 go vet ./...
          GOEXPERIMENT=jsonv2 go test -race ./...

  no-jsonv2:
    # Consumer guarantee: the SDK (everything except the daemon) must build
    # and test under the DEFAULT Go regime too — consumers do not set
    # GOEXPERIMENT. internal/reviewd + cmd/visionreviewd are excluded:
    # go-cqrs-lite imports encoding/json/v2, which only exists under the
    # jsonv2 experiment (the daemon always builds with it; see flake.nix).
    name: SDK without GOEXPERIMENT=jsonv2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build, vet, test SDK packages (default regime)
        run: |
          go build ./pkg/... ./cmd/vision/... ./internal/catalog/... ./internal/cli/... ./internal/visionutil/... ./examples/...
          go vet ./pkg/... ./cmd/vision/... ./internal/catalog/... ./internal/cli/... ./internal/visionutil/...
          go test -race ./pkg/... ./internal/catalog/... ./internal/cli/... ./internal/visionutil/...

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix flake check
        run: nix --extra-experimental-features 'nix-command flakes' flake check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
