name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # go-cqrs-lite imports encoding/json/v2, which only exists under
      # GOEXPERIMENT=jsonv2 (local dev sets it via `go env`). Every job that
      # loads packages (build/vet/test/tidy) needs it.
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guards the repo against the recurring json/v2 breakage class
      # (documented 4 incidents in AGENTS.md): the go-auto-upgrade daemon
      # edits imports directly, bypassing lint. depguard only covers lint
      # runs, so this grep is the only gate that fires on a plain commit.
      # Mirror of the depguard deny list in .golangci.yaml.
      - name: Forbid encoding/json/v2 and jsontext imports
        run: |
          if git grep -nE --untracked '"encoding/json/(v2|jsontext)(/[a-z0-9]+)?"' -- '*.go'; then
            echo "::error::Direct encoding/json/v2 or encoding/json/jsontext imports are forbidden."
            echo "::error::The jsonv2 experiment swaps encoding/json in place; the v2 import paths need a go.mod replace and a different low-level API (see AGENTS.md)."
            echo "::error::Import plain encoding/json instead - it transparently supports both regimes."
            exit 1
          fi
          echo "No forbidden json/v2 imports found."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Catches a tampered or stale go.sum against the checksum database;
      # tidiness alone would not.
      - name: Verify module checksums
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Verify examples compile
        run: go build ./examples/...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Coverage gate (>=70%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 70% threshold"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify golangci-lint config
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint config verify

      - name: golangci-lint
        # v7 is required for golangci-lint v2 (v6 resolved "latest" to a
        # stale v1.64.8 binary built with go1.24, unable to target go 1.26).
        # The version MUST match the local golangci-lint (pinned, never
        # @latest): lint findings differ between minor versions, and a
        # mismatch is how red-lint commits slip through one side unseen.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)"

  jsonv2-compat:
    name: encoding/json v2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build & test under GOEXPERIMENT=jsonv2
        run: |
          GOEXPERIMENT=jsonv2 go build ./...
          GOEXPERIMENT=jsonv2 go vet ./...
          GOEXPERIMENT=jsonv2 go test -race ./...

  no-jsonv2:
    # json-v1 regime watchdog (2026-10-31 scope change). Original intent: the
    # SDK builds and tests under GOEXPERIMENT=none. That is IMPOSSIBLE while
    # fantasy >= v0.45.2 is pinned: it floors kaptinlin/jsonschema v0.9.9+,
    # which imports encoding/json/v2 in core files — every SDK package
    # transitively reaches it (verified 2026-10-31: the fantasy-free package
    # set is EMPTY). The job sat red for that transitive reason since
    # 2026-09-29, training everyone to ignore a required red check.
    # Options considered: (a) fantasy-free subset — impossible, set is empty;
    # (b) pin fantasy v0.41.1 — regresses the framework and fights the
    # upgrade daemon; (c) drop the job — loses the tripwire entirely.
    # Chosen: (d) watchdog. Green = the v1 failure is still EXACTLY the
    # documented kaptinlin chain (blocker present, our tree v1-clean — our
    # own code is covered by the tree grep in build-and-test and the
    # package-local jsonv2 guard tests). Red with "blocker is GONE" =
    # kaptinlin ships a dual-regime release -> restore the full SDK subset
    # and update AGENTS.md. Red with "chain changed" = investigate
    # immediately: our tree may have gained a direct v2 import.
    name: json-v1 regime watchdog (kaptinlin blocker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Watchdog — assert the documented kaptinlin transitive blocker
        run: |
          export GOEXPERIMENT=none
          set +e
          output=$(go build ./pkg/errors/ 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::pkg/errors now builds under GOEXPERIMENT=none - the kaptinlin/jsonschema transitive blocker is GONE."
            echo "::error::Restore the full no-jsonv2 SDK subset (build/vet/test ./pkg/... ./cmd/vision/... ./internal/{catalog,cli,visionutil}/... ./examples/...) and update the AGENTS.md dual-json bullet."
            exit 1
          fi

          echo "$output"

          if ! grep -q 'kaptinlin/jsonschema' <<<"$output" || ! grep -q 'encoding/json/v2' <<<"$output"; then
            echo "::error::The v1-regime failure no longer matches the documented kaptinlin transitive chain."
            echo "::error::Investigate before trusting this job: our tree may have gained a direct json/v2 import (run the package-local guard tests and the tree grep)."
            exit 1
          fi

          echo "Watchdog green: blocker still present (documented kaptinlin chain); our tree is v1-clean."

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix flake check
        run: nix --extra-experimental-features 'nix-command flakes' flake check

  vendor-hash:
    # go.sum changes shift the nix vendorHash; a stale vendorHash.nix
    # otherwise only surfaces inside nix-flake-check as an opaque hash
    # mismatch. Build the daemon derivation directly so the failure is
    # early and the fix (nix run .#update-vendor-hash) is in the message.
    name: vendorHash consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build visionreviewd (vendorHash.nix must match go.sum)
        run: |
          if ! nix --extra-experimental-features 'nix-command flakes' build .#visionreviewd --no-link; then
            echo "::error::vendorHash.nix is stale for the current go.mod/go.sum."
            echo "::error::Run 'nix run .#update-vendor-hash' locally and commit the result."
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      # go-cqrs-lite imports encoding/json/v2; package loading (which
      # govulncheck needs for reachability) fails without the experiment.
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan for reachable vulnerabilities
        # Symbol-level scan: fails only when OUR code reaches a vulnerable
        # symbol. Module-level findings against unfixed advisories do not
        # fail the build (triage them in the status report).
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dep-drift:
    name: dep-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Advisory, not gating: drift is expected between bumps. This makes
      # staleness visible on every push instead of failing the build.
      - name: Report dependency drift
        run: |
          bash scripts/check-deps.sh || echo "::warning::Dependency drift detected (advisory, see log above)"
