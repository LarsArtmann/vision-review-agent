name: Scheduled Security

# Catches what push-triggered CI cannot: vulnerabilities published AFTER a
# commit lands, against a dependency set that has not changed.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (weekly)
    runs-on: ubuntu-latest
    env:
      # go-cqrs-lite imports encoding/json/v2; package loading (which
      # govulncheck needs for reachability) fails without the experiment.
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Scan for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dep-drift:
    name: dep-drift (weekly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Report dependency drift
        run: |
          bash scripts/check-deps.sh || echo "::warning::Dependency drift detected (advisory, see log above)"
