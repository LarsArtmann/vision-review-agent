version: "2"
run:
  timeout: 5m
  go: 1.26.7
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - charm\.land/fantasy\..*
        - net/http\..*
        - image/png\..*
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.Config$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.PreprocessConfig$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.AnalyzeResult$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.BatchResult$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.Conversation$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.CostTracker$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.ScreenshotAnalyzer$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.Component$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.ChildList$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.DynamicChildren$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.CreateSurface$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.UpdateComponents$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.UpdateDataModel$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.DeleteSurface$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.SurfaceSpec$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.ComponentSpec$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.GenerateOptions$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.GenerateResult$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.Accessibility$
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.ValidationIssue$
        - github\.com/larsartmann/vision-review-agent/internal/reviewd\.Config$
        - github\.com/larsartmann/vision-review-agent/internal/reviewd\.PassResult$
        - github\.com/larsartmann/vision-review-agent/internal/reviewd\.ReplayResult$
        - charm\.land/catwalk/pkg/catwalk\.Provider$
        - charm\.land/catwalk/pkg/catwalk\.Model$
    funlen:
      lines: 70
      statements: 40
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G306
        - G304
        - G117
        - G101
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        - github\.com/larsartmann/vision-review-agent/pkg/vision/a2ui\.Message$
    makezero:
      always: false
    misspell:
      ignore-rules:
        - reviewd
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    nolintlint:
      require-explanation: true
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - tc
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        - wg
        - mu
        - h
        - w
        - va
        - sa
        - x
        - "y"
        - p
    wrapcheck:
      extra-ignore-sigs:
        - context.Context.Err()
        - (context.Context).Err()
        - .(charm.land/fantasy.LanguageModel).
        - .(charm.land/fantasy.Agent).
        - (charm.land/fantasy.LanguageModel).
        - (charm.land/fantasy.Agent).
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - err113
      - path: (cmd|examples|internal/cli)/
        linters:
          - forbidigo
      - path: (cmd|examples|internal/cli|internal/catalog)/
        linters:
          - ireturn
      - path: examples/
        linters:
          - mnd
      - path: (cmd|examples|internal/cli|internal/catalog)/
        linters:
          - mnd
      - path: _test\.go
        text: unused
        linters:
          - unused
      - text: Error return value of `fmt.F(println|printf|print).*` is not checked
        linters:
          - errcheck
    paths:
      - \.gen\.go$
      - _templ\.go$
      - pkg/vision/
      - pkg/vision/a2ui/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
      - pkg/vision/
      - pkg/vision/a2ui/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
