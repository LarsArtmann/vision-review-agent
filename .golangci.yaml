version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    # goexperiment.jsonv2 intentionally omitted: json/v2 is still an
    # experimental GOEXPERIMENT and no source uses it. Its presence here
    # misled go-auto-upgrade into a broken encoding/json -> encoding/json/v2
    # migration (jsontext.Encoder has no SetIndent). Add it back only when
    # the codebase deliberately adopts json/v2 with GOEXPERIMENT=jsonv2.
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          # Note: golangci-lint v2 does not support the $module variable for
          # automatic module-path resolution (regression from v1). The module
          # path is hardcoded below instead. Update it if the module path
          # in go.mod changes.
          allow:
            - $gostd
            - github.com/larsartmann/vision-review-agent
            - github.com/larsartmann/go-cqrs-lite
            - charm.land/fantasy
            - charm.land/catwalk
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
            - github.com/stretchr/testify
            - golang.org/x/sync
            - golang.org/x/image
    exhaustruct:
      exclude:
        - os/exec.Cmd
        # External types we construct partially (can't control their fields)
        - charm\.land/fantasy\..*
        - net/http\..*
        - image/png\..*
        # Own types with many optional fields where zero-value = default/unset.
        # These use intentional partial initialization patterns.
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.Config$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.PreprocessConfig$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.AnalyzeResult$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.BatchResult$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.Conversation$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.CostTracker$
        - github\.com/larsartmann/vision-review-agent/pkg/vision\.ScreenshotAnalyzer$
        - charm\.land/catwalk/pkg/catwalk\.Provider$
        - charm\.land/catwalk/pkg/catwalk\.Model$
    funlen:
      lines: 70
      statements: 40
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G306
        - G304
        - G117
        - G101
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: false
    nolintlint:
      require-explanation: true
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - tc
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        - wg
        - mu
        - h
        - w
        - va
        - sa
        - x
        - y
        - p
    wrapcheck:
      ignoreSigs:
        - .Errorf(
        - context.Context.Err()
        - (context.Context).Err()
        # fantasy model/agent methods: the calling public API wraps these
        # errors with *apperrors.ModelError (classification). Internal
        # helpers return the raw error so the caller can classify it.
        - .(charm.land/fantasy.LanguageModel).
        - .(charm.land/fantasy.Agent).
        - (charm.land/fantasy.LanguageModel).
        - (charm.land/fantasy.Agent).
      ignore-type-assert-ok: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - err113
      - path: (cmd|examples|internal/cli)/
        linters:
          - forbidigo
      - path: (cmd|examples|internal/cli|internal/catalog)/
        linters:
          - ireturn
      - path: examples/
        linters:
          - mnd
      - path: (cmd|examples|internal/cli|internal/catalog)/
        linters:
          - mnd
      - path: _test\.go
        text: unused
        linters:
          - unused
      - text: "Error return value of `fmt.F(println|printf|print).*` is not checked"
        linters:
          - errcheck
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
